<!DOCTYPE html>

<style>

#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:var(--ink);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:10px 12px;min-height:44px;cursor:pointer}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}button:disabled{opacity:.4}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.home{padding:20px;max-width:640px;margin:0 auto;overflow:auto}.home h1{font-size:28px;margin:8px 0 4px}.home p{color:var(--mut);margin:0 0 16px}
.list{display:grid;gap:8px;margin-bottom:16px}.list button{text-align:left}.list small{display:block;color:var(--mut)}
.bar{display:flex;gap:6px;padding:6px;background:var(--pn);border-bottom:1px solid var(--ln);overflow-x:auto;flex:none}.bar button{white-space:nowrap;padding:6px 10px;min-height:44px}
#cv{flex:1;min-height:0;position:relative;background-color:var(--bg);touch-action:none}svg{width:100%;height:100%;display:block;touch-action:none}
#msg{position:absolute;left:8px;right:8px;top:8px;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;font-size:13px;pointer-events:none}
.pal button{padding:6px 10px}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:70%;background:var(--pn);border-top:2px solid var(--ac);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.sheet .log{overflow:auto;padding:10px;flex:1;min-height:80px;white-space:pre-wrap}.sheet .q{display:flex;gap:6px;padding:6px;overflow-x:auto}
.sheet .in{display:flex;gap:6px;padding:6px}.sheet input{flex:1;font:inherit;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0}
.me{color:var(--ac);margin-top:8px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.modal>div{background:var(--pn);border-radius:8px;padding:16px;max-width:420px;width:100%;max-height:90%;overflow:auto}
.modal label{display:block;margin:10px 0 2px}.modal select,.modal textarea{width:100%;font:inherit;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:6px;box-sizing:border-box}
.ut{transform-box:fill-box;transform-origin:center;transform:scaleX(var(--m,1)) rotate(var(--r,0deg))}.rod{transition:transform .5s}.glow{filter:drop-shadow(0 0 6px var(--live))}@media(prefers-reduced-motion:reduce){.rod{transition:none}}
</style></head><body><div id="app"></div>

{k:'t2',n:'Relay-controlled lamp',d:'Button energizes K1, contact K1 lights L1',f:()=>mk([['P1','SRC','+24V',40,140],['S1','PB_NO','S1',140,80],['K1','COIL','K1',260,80],['G1','GND','0V',360,100],['C1','K_NO','K1',140,200,'K1'],['L1','LAMP','L1',260,200],['G2','GND','0V',360,220]],[['P1.0','S1.0'],['S1.1','K1.0'],['K1.1','G1.0'],['P1.0','C1.0'],['C1.1','L1.0'],['L1.1','G2.0']])},

let S={c:[],w:[],sel:null,pend:null,mode:'edit',v:{x:0,y:0,k:1},flt:[],name:'',ch:0,ev:[],t0:Date.now(),hints:0,fixes:0,edits:0,drag:null,held:null,pan:null,res:null,seq:1};

function solve(E){const par={},f=x=>(par[x]===undefined||par[x]===x)?(par[x]=x):(par[x]=f(par[x])),u=(a,b)=>{par[f(a)]=f(b)};
S.w.forEach(w=>u(w[0],w[1]));S.c.filter(c=>TY[c.t].rail).forEach(c=>ports(c).forEach((_,i)=>u(c.id+'.'+i,c.id+'.0')));

const Hs=new Set(),Ls=new Set();S.c.forEach(c=>{if(c.t=='SRC')Hs.add(f(c.id+'.0'));if(c.t=='GND')Ls.add(f(c.id+'.0'))});

function sim(){let E=S.E||{},r;for(let i=0;i<20;i++){r=solve(E);if(JSON.stringify(r.E)==JSON.stringify(E))break;E=r.E}S.E=r.E;S.res=r;return r}

let b='';const L=y.ld?'<line x1="-30" x2="30" stroke="var(--ink)"/>':'';

else if(y.rail)b=RL(c);else if(0)b=`<path d="M0 0H${((c.n||4)-1)*80}" stroke="var(--ink)" stroke-width="4" fill="none"/><rect data-c="${c.id}" x="0" y="-8" width="${((c.n||4)-1)*80}" height="16" fill="transparent"/><text x="-10" y="4" text-anchor="end" font-size="12" fill="var(--ink)">${y.n}</text>`;
else if(c.t=='CYL'){const x=r.E[c.ref],k='stroke="var(--ink)" stroke-width="2" fill="none"';b=`<path ${k} d="M-50 -10H30V10H-50ZM-60 0H-50"/><path ${k} stroke-width="1.5" d="M-6 0l4-6 6 12 6-12 6 12 6-12 6 12 2-6"/><g class="rod" style="transform:translateX(${x?36:0}px)"><path ${k} d="M-44 -10V10M-44 0H60"/></g>`+tx(x?'extended':'retracted',28,11)}
else if(c.t=='AIR')b=AB();else if(0)b=`<circle r="14" fill="var(--pn)" stroke="var(--ink)" stroke-width="2"/><path d="M-6 -5H6L0 6Z" fill="var(--ink)"/><path d="M0 14V20" stroke="var(--ink)" stroke-width="2"/>`;
else if(y.vl)b=VB2(c);else if(0)b=VB(c);else if(0){const A=S.pr.pos[c.id]=='a',k='stroke="var(--ink)" stroke-width="1.5" fill="none"',sq=(x,on)=>`<rect x="${x}" y="-24" width="56" height="48" fill="${on?'var(--live)':'var(--pn)'}" fill-opacity="${on?.4:1}" stroke="var(--ink)" stroke-width="2"/>`,ex=x=>`<path ${k} d="M${x} 24V30"/><path ${k} d="M${x-5} 38L${x} 30L${x+5} 38Z"/>`,tl=(s,x,y2)=>`<text x="${x}" y="${y2}" text-anchor="middle" font-size="9" fill="var(--mut)">${s}</text>`;
b=`<rect data-c="${c.id}" x="-102" y="-24" width="156" height="48" fill="transparent"/>`+sq(-84,A)+sq(-28,!A)+`<path ${k} marker-end="url(#ah)" d="M-56 24L-70 -24"/><path ${k} marker-end="url(#ah)" d="M-42 -24V24"/><path ${k} marker-end="url(#ah)" d="M0 24L14 -24"/><path ${k} marker-end="url(#ah)" d="M-14 -24V24"/>`+ex(-14)+ex(14)+`<rect x="-102" y="-12" width="18" height="24" fill="var(--pn)" stroke="var(--ink)" stroke-width="2"/><path ${k} d="M-102 12L-84 -12"/>`+(c.t=='V52'?`<path ${k} stroke-width="2" d="M28 0l3-7 5 14 5-14 5 14 5-14 3 7"/>`:`<rect x="28" y="-12" width="18" height="24" fill="var(--pn)" stroke="var(--ink)" stroke-width="2"/><path ${k} d="M46 12L28 -12"/>`)+tl('4',-22,-28)+tl('2',22,-28)+tl('1',8,46)}
else if(c.t=='CYL2')b=CB3(c);else if(0){const p=S.pos[c.id]||0,px=-50+80*p,k='stroke="var(--ink)" stroke-width="2" fill="none"';b=`<rect data-c="${c.id}" x="-60" y="-14" width="200" height="28" fill="transparent"/><path ${k} d="M-60 -10H40V10H-60ZM-50 10V20M30 10V20"/><path ${k} stroke-width="3" d="M${px} -10V10"/><path ${k} d="M${px} 0H${px+100}"/>`+tx(p>=.99?'extended':p<=.01?'retracted':'moving',-24,10)}
else if(y.sw||y.ct||y.ls)b=SB2(c,cl);else if(c.t=='COIL'||c.t=='SOL')b=RB(c,on);else if(y.ld)b=`<rect x="-22" y="-11" width="44" height="22" fill="${on?'var(--live)':'var(--pn)'}" stroke="var(--ink)"/>`+(c.t=='COIL'?`<text x="-26" y="-4" font-size="8" text-anchor="middle" fill="var(--mut)">A1</text><text x="26" y="-4" font-size="8" text-anchor="middle" fill="var(--mut)">A2</text>`:'');
else{const bad=S.flt.includes(c.id)&&!S.ch,sc=bad?'var(--bad)':cl?'var(--live)':'var(--ink)',n=y.sw?(y.nc?[1,2]:[3,4]):(y.nc?[11,12]:[13,14]),a=`stroke="${sc}" stroke-width="${cl||bad?3:2}" fill="none"`,d=`stroke="var(--ink)" stroke-width="1.5" fill="none"`;
b=`<path ${a} d="M-30 0H-10M10 0H30M-10 0L10 -14${y.nc?'M10 -14V0M5 -14H15':''}"/>`+(y.sw?`<path ${d} stroke-dasharray="3 2" d="M0 -7V-22"/>`:'')+(y.pb?`<path ${d} d="M-6 -22H6"/>`:'')+(y.sw&&!y.pb?`<path ${d} d="M-6 -22H6M-3 -15H3"/>`:'')+`<text x="-24" y="14" font-size="8" text-anchor="middle" fill="var(--mut)">${n[0]}</text><text x="24" y="14" font-size="8" text-anchor="middle" fill="var(--mut)">${n[1]}</text>`}

function draw(){const r=sim(),er=validate(r);S.pr=psim(r);S.lg=LG();if(S.c.some(c=>c.t=='CYL2'&&S.pr.tgt[c.id]!==undefined&&S.pr.tgt[c.id]!=(S.pos[c.id]||0))&&!S.raf)S.raf=requestAnimationFrame(tick);
const wires=S.w.map((w,i)=>{const a=W(w[0]),b=W(w[1]),pw=kd(w[0])=='p',m=Math.round((a[0]+b[0])/2/G)*G,act=pw?S.pr.P.has(S.pr.f(w[0])):r.A.has(r.f(w[0]));const d=route(w);return`<path d="${d}" fill="none" stroke="${pw?'var(--ac)':act?'var(--live)':'var(--ink)'}" stroke-opacity="${pw&&!act?.55:1}" stroke-width="${act?4:2}"/><path data-w="${i}" d="${d}" fill="none" stroke="transparent" stroke-width="16"/>`}).join('');

['rot','rotl','mir','dup','del','flt','rep'].forEach(k=>$('#b_'+k).disabled=!sel);$('#b_rep').style.display=S.ch?'':'none';$('#b_flt').style.display=S.ch?'none':'';

function save(){try{localStorage.setItem('mcl',JSON.stringify(cur()))}catch(e){}}
function home(){let sv=null;try{sv=JSON.parse(localStorage.getItem('mcl'))}catch(e){}
$('#app').innerHTML=`<div class="home"><h1>MechAI Circuit Lab</h1><p>Build DIN current-path diagrams (Stromlaufplan), simulate them, and get AI help when they fail.</p>
<div class="list">${sv?'<button id="cont" class="p">Continue: '+(sv.name||'last circuit')+'</button>':''}<button id="new">New empty circuit</button>
